name: what_changes_postgresql

services:
  data-init:
    build:
      context: .
    user: "0:0"
    command: ["chown", "-R", "1000:1000", "/app/data/source_snapshots", "/app/data/generated_reports"]
    restart: "no"
    network_mode: none
    volumes:
      - source_snapshots:/app/data/source_snapshots
      - generated_reports:/app/data/generated_reports
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:18.4-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/18/docker
    expose:
      - "5432"
    networks:
      - backend
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    cpus: 1.0
    mem_limit: 2g
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  web:
    build:
      context: .
    restart: unless-stopped
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "2", "--timeout", "60"]
    env_file:
      - .env
    depends_on:
      data-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - backend
      - outbound
    volumes:
      - source_snapshots:/app/data/source_snapshots
      - generated_reports:/app/data/generated_reports
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    cpus: 1.5
    mem_limit: 2g
    pids_limit: 256
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  ollama:
    profiles:
      - ai
    image: ollama/ollama:0.32.9@sha256:1685741456770df6e3cceb2a945a5f75e020f658d1701509668d6f4688f1dd3f
    user: "${OLLAMA_UID:-1000}:${OLLAMA_GID:-1000}"
    restart: unless-stopped
    stop_grace_period: 2m
    environment:
      HOME: /tmp
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MODELS: /models
      OLLAMA_NO_CLOUD: "true"
      OLLAMA_NUM_PARALLEL: "1"
    expose:
      - "11434"
    networks:
      - backend
    volumes:
      - type: bind
        source: ${OLLAMA_MODELS_PATH:?Set OLLAMA_MODELS_PATH in .env}
        target: /models
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    cpus: 3.0
    mem_limit: 10g
    pids_limit: 512
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  backend:
    name: what_changes_postgresql_backend
    internal: true
  outbound:
    name: what_changes_postgresql_outbound

volumes:
  postgres_data:
    name: what_changes_postgresql_postgres_data
  source_snapshots:
    name: what_changes_postgresql_source_snapshots
  generated_reports:
    name: what_changes_postgresql_generated_reports
