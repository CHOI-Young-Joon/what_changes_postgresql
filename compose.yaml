name: what_changes_postgresql

# P04에서 web, worker, scheduler, db, proxy, omniroute를 추가한다.
services:
  ollama:
    image: ollama/ollama:0.32.9@sha256:1685741456770df6e3cceb2a945a5f75e020f658d1701509668d6f4688f1dd3f
    user: "${OLLAMA_UID:-1000}:${OLLAMA_GID:-1000}"
    restart: unless-stopped
    stop_grace_period: 2m
    environment:
      HOME: /tmp
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MODELS: /models
      OLLAMA_NO_CLOUD: "true"
      OLLAMA_NUM_PARALLEL: "1"
    expose:
      - "11434"
    networks:
      - backend
    volumes:
      - type: bind
        source: ${OLLAMA_MODELS_PATH:?Set OLLAMA_MODELS_PATH in .env}
        target: /models
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    cpus: 3.0
    mem_limit: 10g
    pids_limit: 512
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  edge:
    name: what_changes_postgresql_edge
  backend:
    name: what_changes_postgresql_backend
    internal: true

volumes:
  postgres_data:
    name: what_changes_postgresql_postgres_data
  source_snapshots:
    name: what_changes_postgresql_source_snapshots
  generated_reports:
    name: what_changes_postgresql_generated_reports
